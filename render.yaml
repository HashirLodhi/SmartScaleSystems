services:
  - type: web
    name: smart-scale-systems-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./site-dist
    envVars:
      - key: VITE_API_ORIGIN
        value: https://api.smartscalesystems.tech
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /project-images/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /services
        destination: /services.html
      - type: rewrite
        source: /projects
        destination: /projects.html
      - type: rewrite
        source: /team
        destination: /team.html
      - type: rewrite
        source: /contact
        destination: /contact.html
      - type: rewrite
        source: /privacy-policy
        destination: /privacy-policy.html
      - type: rewrite
        source: /terms-of-service
        destination: /terms-of-service.html
      - type: rewrite
        source: /services/*
        destination: /services/*.html
  - type: web
    name: smart-scale-systems-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://www.smartscalesystems.tech,https://smartscalesystems.tech
      - key: GROQ_API_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
